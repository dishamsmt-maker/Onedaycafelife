name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and menu images
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 5 --retry-delay 3 --retry-all-errors "$GAME_URL" -o /tmp/game.html
          for atlas in food-atlas drinks-atlas individual-food-atlas; do
            curl --fail --retry 5 --retry-delay 3 --retry-all-errors "${GAME_URL}menu/${atlas}.webp" -o "/tmp/${atlas}.webp"
            test "$(wc -c < "/tmp/${atlas}.webp")" -gt 1000
          done
