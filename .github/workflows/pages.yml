name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify playable build before publishing
        run: |
          export CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) | head -n 1)"
          test -n "$CHROMIUM_PATH"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-browser-evidence
          path: test-results/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published page and menu images
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 5 --retry-delay 3 --retry-all-errors "$GAME_URL" -o /tmp/game.html
          for atlas in food-atlas drinks-atlas individual-food-atlas; do
            curl --fail --retry 5 --retry-delay 3 --retry-all-errors "${GAME_URL}menu/${atlas}.webp" -o "/tmp/${atlas}.webp"
            test "$(wc -c < "/tmp/${atlas}.webp")" -gt 1000
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Play the published game in mobile Chromium
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/published-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-game-evidence
          path: test-results/published/
