name: QA PR stack gate (read-only, no deploy)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test QA gate (mock fixtures only, no GitHub writes)
        run: node --test scripts/pr-stack-audit.test.mjs
      - name: Run existing unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
